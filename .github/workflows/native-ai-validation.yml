name: Native AI foundation validation
on:
  push:
    branches: [feature/gamjassak-native-ai]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/native-ai.spec.ts tests/media-import.spec.ts --workers=2
      - run: npm run build
      - name: Confirm commercial release remains blocked
        run: |
          if npm run ai:release:check; then
            echo 'Unexpected release approval for untrained foundation'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ai-foundation-evidence
          path: |
            native-ai-output/provenance.json
            native-ai-output/model.json
            test-results/
          retention-days: 7
  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust and Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev python3-pil
          rustup toolchain install stable --profile minimal
          /usr/bin/python3 -c "from PIL import Image; Image.open('src-tauri/icons/icon.ico').convert('RGBA').save('src-tauri/icons/icon.png')"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
