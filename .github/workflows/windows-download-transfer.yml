name: Windows download transfer

on:
  workflow_dispatch:
  push:
    branches: [feature/warm-journal-v2]
    paths: [.github/workflows/windows-download-transfer.yml]

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Oraedameun-Windows-0.3.1
          run-id: 36644502021
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-output
      - name: Split tested downloads for bounded file transfers
        shell: python
        run: |
          import pathlib, zipfile
          with zipfile.ZipFile('tested-windows.zip', 'w', compression=zipfile.ZIP_STORED) as archive:
              for p in sorted(pathlib.Path('release-output').iterdir()): archive.write(p, p.name)
          pathlib.Path('transfer').mkdir()
          with open('tested-windows.zip', 'rb') as source:
              index = 0
              while chunk := source.read(28 * 1024 * 1024):
                  pathlib.Path(f'transfer/part-{index:02}.bin').write_bytes(chunk)
                  index += 1
          if index > 20: raise RuntimeError('More than 20 transfer parts required')
          print(f'Prepared {index} parts from the tested Windows downloads.')
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/part-00.bin') != ''
        with:
          name: Windows-0.3.1-transfer-00
          path: transfer/part-00.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/part-01.bin') != ''
        with:
          name: Windows-0.3.1-transfer-01
          path: transfer/part-01.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/part-02.bin') != ''
