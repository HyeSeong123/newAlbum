name: People and pets UX validation

on:
  workflow_dispatch:
  push:
    branches: [feature/people-pets-ux-20261022]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'playwright*.ts'
      - 'package*.json'
      - '.github/workflows/entity-ux-validation.yml'

permissions:
  contents: read

concurrency:
  group: entity-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust and SQLite regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev python3-pil
          rustup toolchain install stable --profile minimal
          /usr/bin/python3 -c "from PIL import Image; Image.open('src-tauri/icons/icon.ico').convert('RGBA').save('src-tauri/icons/icon.png')"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run native transactions and migrations
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -j 2
      - name: Run SQLite compatibility regressions
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  browser:
    name: Desktop and Android-sized browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UX_BASELINE_SHA: cd3d1be70331d35d504c7081022b2cead8351498
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without model lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate frontend and unit tests
        run: |
          npm run version:check
          npm run test:unit
          npm run build --ignore-scripts
      - name: Install official Playwright test browser
        run: npx playwright install --with-deps chromium
      - name: Capture baseline phone screens
        run: |
          git worktree add --detach "$RUNNER_TEMP/entity-baseline" "$UX_BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/entity-baseline/node_modules"
          cp playwright.entities.config.ts "$RUNNER_TEMP/entity-baseline/"
          cp tests/entity-visuals.spec.ts "$RUNNER_TEMP/entity-baseline/tests/"
          cd "$RUNNER_TEMP/entity-baseline"
          ENTITY_UX_BASELINE=1 "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test -c playwright.entities.config.ts --project mobile
      - name: Exercise updated classification workflows
        if: success() || failure()
        run: npx playwright test -c playwright.entities.config.ts
      - name: Upload test results and before-after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-ux-results-${{ github.sha }}
          path: |
            test-results/
            preview-results/
            ${{ runner.temp }}/entity-baseline/preview-results/
            ${{ runner.temp }}/entity-baseline/test-results/
          if-no-files-found: warn
          retention-days: 14
