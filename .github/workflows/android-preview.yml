name: Android preview APK

on:
  workflow_dispatch:
    inputs:
      full_ui_validation:
        description: Run unrelated full Android UI and photo regressions too
        type: boolean
        default: false
  push:
    branches: [feature/warm-journal-v2, feature/gamjassak-native-ai, feature/gamjassak-audit-refactor, feature/people-pets-ux-android-20261022, feature/app-ux-20261023, feature/pet-recognition-ux-20261023, feature/person-selective-precision-20261028, master, final, fix/apk-ci-regressions-20261116, feature/android-backup-restore, feature/character-design-audit, feature/soft-pencil-friends, feature/character-names, feature/album-introduction-entry]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'models/gomi-lora-v4/**'
      - 'models/gomi-action-v3/**'
      - 'local-ai/*.json'
      - 'scripts/prepare-gomi-action-model.mjs'
      - 'scripts/gomi-action-smoke.mjs'
      - 'scripts/verify-gomi-apk.py'
      - 'tests/gomi-apk-verification.test.py'
      - 'scripts/prepare-android.mjs'
      - 'scripts/android-signing.mjs'
      - 'scripts/android-signing-policy.json'
      - 'scripts/android-app.mjs'
      - 'tests/android-signing.test.mjs'
      - 'scripts/prepare-ai.mjs'
      - 'scripts/prepare-own-character-ai.mjs'
      - 'tests/android-prepare.test.mjs'
      - 'scripts/release/**'
      - 'scripts/prepare-pet-models.mjs'
      - 'scripts/prepare-recognition-models.mjs'
      - 'scripts/recognition-models.lock.json'
      - 'scripts/prepare-face-models.mjs'
      - 'scripts/face-models.lock.json'
      - 'scripts/person-runtime-benchmark.mjs'
      - 'scripts/person-repetition-smoke.mjs'
      - 'scripts/pet-model-lock.json'
      - 'scripts/pet-runtime-benchmark.mjs'
      - 'scripts/smoke-android.mjs'
      - 'scripts/backup-smoke.mjs'
      - 'scripts/seed-emulator-bond.py'
      - 'scripts/manual-photo-smoke.mjs'
      - 'scripts/app-ux-smoke.mjs'
      - 'scripts/pet-improvements-smoke.mjs'
      - 'scripts/gallery-smoke.mjs'
      - 'scripts/location-settings-smoke.mjs'
      - 'scripts/friend-motions-smoke.mjs'
      - 'package*.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Draft release assets require repository push access even for this download.
    # This short-lived job token stages the model; no token is packaged in the APK.
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
      # Keep the inspectable preview, but ship optimized Rust without debug symbols.
      CARGO_PROFILE_DEV_OPT_LEVEL: s
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: symbols
      NDK_VERSION: '28.2.13676358'
      GAMJASSAK_ANDROID_CERTIFICATE_SHA256: ${{ vars.GAMJASSAK_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Require enrolled permanent signing identity
        env:
          GAMJASSAK_ANDROID_KEYSTORE_BASE64: ${{ secrets.GAMJASSAK_ANDROID_KEYSTORE_BASE64 }}
          GAMJASSAK_ANDROID_STORE_PASSWORD: ${{ secrets.GAMJASSAK_ANDROID_STORE_PASSWORD }}
          GAMJASSAK_ANDROID_KEY_PASSWORD: ${{ secrets.GAMJASSAK_ANDROID_KEY_PASSWORD }}
          GAMJASSAK_ANDROID_KEY_ALIAS: ${{ secrets.GAMJASSAK_ANDROID_KEY_ALIAS }}
        run: node scripts/android-signing.mjs prepare "$RUNNER_TEMP/gamjassak-update.keystore"
      - name: Prepare SDK and Rust targets
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install and validate frontend
        run: |
          npm ci
          npm run version:check
          npm run test:unit
          node --test tests/android-prepare.test.mjs tests/android-signing.test.mjs tests/android-signing-setup.test.mjs
          python3 tests/gomi-apk-verification.test.py
          python3 tests/own-character-apk.test.py
          python3 -m unittest discover -s tests -p test_gomi_selection_v3.py
          python3 -m unittest discover -s tests -p test_gomi_corpus_v3.py
      - name: Stage first-party character AI
        run: node scripts/prepare-own-character-ai.mjs
      - name: Initialize Android project and approved icon
        run: |
          npx tauri android init --ci --skip-targets-install
          npm run android:prepare
          npx tauri icon public/brand/gomgomi-icon.json
      - name: Restore identical preview APKs
        id: preview-apks
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/gen/android/app/build/outputs/apk
          key: android-own-ai-v1-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'src-tauri/*.*', 'src-tauri/src/**', 'src-tauri/database/**', 'src-tauri/android/**', 'src-tauri/capabilities/**', 'src-tauri/permissions/**', 'package*.json', 'scripts/prepare-*.mjs', 'scripts/*models*.json', 'scripts/android-*.mjs', 'scripts/android-*.json', 'vite.config.ts', 'index.html', 'rust-toolchain.toml', '!**/__pycache__/**', '!**/*.pyc') }}
      - name: Build installable preview APKs
        if: steps.preview-apks.outputs.cache-hit != 'true'
        run: npx tauri android build --debug --apk --ci --features custom-protocol --target aarch64 x86_64 --split-per-abi
      - name: Sign previews with the enrolled permanent identity
        id: signed-previews
        env:
          GAMJASSAK_ANDROID_STORE_PASSWORD: ${{ secrets.GAMJASSAK_ANDROID_STORE_PASSWORD }}
          GAMJASSAK_ANDROID_KEY_PASSWORD: ${{ secrets.GAMJASSAK_ANDROID_KEY_PASSWORD }}
          GAMJASSAK_ANDROID_KEY_ALIAS: ${{ secrets.GAMJASSAK_ANDROID_KEY_ALIAS }}
        run: |
          while IFS= read -r -d '' preview_apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$preview_apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/gamjassak-update.keystore" --ks-key-alias "$GAMJASSAK_ANDROID_KEY_ALIAS" --ks-pass env:GAMJASSAK_ANDROID_STORE_PASSWORD --key-pass env:GAMJASSAK_ANDROID_KEY_PASSWORD "$preview_apk"
            node scripts/android-signing.mjs verify-apk "$preview_apk"
            python3 scripts/verify-own-character-apk.py "$preview_apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$preview_apk"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0)
      - name: Preserve successful APK build for emulator checks
        if: steps.preview-apks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/gen/android/app/build/outputs/apk
          key: ${{ steps.preview-apks.outputs.cache-primary-key }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installed app on Android
        timeout-minutes: 25
        env:
          GOMGOMI_ALBUM_INTRODUCTION_SMOKE: ${{ github.event_name == 'push' && github.ref_name == 'feature/album-introduction-entry' && '1' || '0' }}
          GOMGOMI_FOCUSED_AI_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ui_validation && '0' || '1' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # Pin the emulator binary independently of the Android 16 image.
          emulator-build: '15507667'
          # Isolate the SwiftShader renderer exits with Mesa's software backend.
          # Keep kernel output when the guest exits before ADB can collect logs.
          emulator-options: -no-window -gpu lavapipe -cores 4 -memory 4096 -no-snapshot -noaudio -no-boot-anim -show-kernel
          disable-animations: true
          script: node scripts/smoke-android.mjs
      - name: Prepare phone APK download
        id: phone-apk
        if: always() && steps.signed-previews.outcome == 'success'
        run: |
          mkdir -p release-output/android
          task_version="$(node -p 'require("./package.json").version')"
          phone_apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*arm64*debug.apk' -print -quit)"
          test -n "$phone_apk"
          cp "$phone_apk" "release-output/android/Gomgomi-${task_version}.apk"
          sha256sum "release-output/android/Gomgomi-${task_version}.apk"
          echo "APP_VERSION=$task_version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always() && steps.phone-apk.outcome == 'success'
        with:
          name: Gomgomi-Android-${{ env.APP_VERSION }}
          path: release-output/android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Capture emulator host diagnostics
        if: failure()
        run: |
          mkdir -p test-results/android-smoke
          free -h > test-results/android-smoke/host-memory.txt
          df -h > test-results/android-smoke/host-disk.txt
          sudo dmesg -T > test-results/android-smoke/host-kernel.txt || true
          find /tmp/android-runner -maxdepth 4 -type f > test-results/android-smoke/emulator-crash-files.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Android-screens-${{ github.sha }}
          path: |
            test-results/android-smoke/*.png
            test-results/android-smoke/pet-recognition-smoke.json
            test-results/android-smoke/pet-runtime-benchmark.json
            test-results/android-smoke/pet-cat-face-smoke.json
            test-results/android-smoke/person-runtime-smoke.json
            test-results/android-smoke/person-repetition-smoke.json
            test-results/android-smoke/person-security-smoke.json
            test-results/android-smoke/gallery-smoke.json
            test-results/android-smoke/manual-photos-smoke.json
            test-results/android-smoke/app-ux-smoke.json
            test-results/android-smoke/location-settings.json
            test-results/android-smoke/friend-motions.json
            test-results/android-smoke/pet-improvements-smoke.json
            test-results/android-smoke/gomi-action-smoke.json
            test-results/android-smoke/bonded/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-failure-diagnostics
          path: test-results/android-smoke/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gamjassak-update.keystore"
