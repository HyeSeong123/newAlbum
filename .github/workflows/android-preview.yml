name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [feature/warm-journal-v2, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'scripts/prepare-android.mjs'
      - 'scripts/smoke-android.mjs'
      - 'package*.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: stable
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        id: preview-key
        with:
          path: .preview-keys/android-debug.keystore
          key: gamjassak-android-preview-key-v2
      - name: Prepare SDK and Rust targets
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install and validate frontend
        run: |
          npm ci
          npm run version:check
          npm run test:unit
          node --test tests/android-prepare.test.mjs
      - name: Initialize Android project and approved icon
        run: |
          npx tauri android init --ci --skip-targets-install
          npm run android:prepare
          npx tauri icon public/brand/gamjassak-symbol.png
      - name: Restore identical preview APKs
        id: preview-apks
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/gen/android/app/build/outputs/apk
          key: android-debug-v1-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'src-tauri/*.*', 'src-tauri/android/**', 'src-tauri/capabilities/**', 'src-tauri/permissions/**', 'package*.json', 'scripts/prepare-android.mjs', 'scripts/generate-character-assets.mjs', 'scripts/prepare-face-models.mjs', 'scripts/prepare-pet-models.mjs', 'vite.config.ts', 'index.html', 'rust-toolchain.toml') }}
      - name: Build installable preview APKs
        if: steps.preview-apks.outputs.cache-hit != 'true'
        run: npx tauri android build --debug --apk --ci --features custom-protocol --target aarch64 x86_64 --split-per-abi
      - name: Sign previews with the persistent development key
        run: |
          mkdir -p .preview-keys
          if [ ! -f .preview-keys/android-debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore .preview-keys/android-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Gamjassak Preview,O=Android,C=KR'
          fi
          while IFS= read -r -d '' preview_apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks .preview-keys/android-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$preview_apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$preview_apk"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0)
      - name: Preserve preview signing key
        if: steps.preview-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .preview-keys/android-debug.keystore
          key: gamjassak-android-preview-key-v2
      - name: Preserve successful APK build for emulator checks
        if: steps.preview-apks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/gen/android/app/build/outputs/apk
          key: ${{ steps.preview-apks.outputs.cache-primary-key }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installed app on Android
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 2048M
          # Vulkan can terminate the headless emulator while WebView renders
          # the album. Keep CPU acceleration and use software GLES instead.
          emulator-options: -no-window -memory 2048 -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/smoke-android.mjs
      - name: Capture emulator host diagnostics
        if: failure()
        run: |
          mkdir -p test-results/android-smoke
          free -h > test-results/android-smoke/host-memory.txt
          df -h > test-results/android-smoke/host-disk.txt
          sudo dmesg -T > test-results/android-smoke/host-kernel.txt || true
          find /tmp/android-runner -maxdepth 4 -type f > test-results/android-smoke/emulator-crash-files.txt || true
      - name: Prepare APK downloads
        run: |
          mkdir -p release-output/android
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} release-output/android/ \;
          cp test-results/android-smoke/*.png release-output/android/
          cd release-output/android
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-screens-${{ github.sha }}
          path: test-results/android-smoke/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Gamjassak-Android-preview-${{ github.sha }}
          path: release-output/android/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-failure-diagnostics
          path: test-results/android-smoke/
          if-no-files-found: ignore
