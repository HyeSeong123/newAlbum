name: Source validation

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/warm-journal-v2, feature/gamjassak-native-ai, feature/gamjassak-audit-refactor, master]
  push:
    branches: [feature/warm-journal-v2, feature/gamjassak-native-ai, feature/gamjassak-audit-refactor, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'data/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: read

# Retain the previous group key to cancel any older packaging workflow in flight.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Native storage regression tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev python3-pil
          rustup toolchain install stable --profile minimal
      - name: Prepare local test icon
        run: /usr/bin/python3 -c "from PIL import Image; Image.open('src-tauri/icons/icon.ico').convert('RGBA').save('src-tauri/icons/icon.png')"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run Rust storage and media tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -j 2
      - name: Test legacy album storage
        run: |
          python3 -m unittest discover -s tests -p test_album_storage.py
          python3 -m unittest discover -s tests -p test_pet_storage.py
          python3 -m unittest discover -s tests -p test_person_storage.py
          python3 -m unittest discover -s tests -p test_person_evaluation.py
          python3 -m unittest discover -s tests -p test_recognition_094.py
          python3 -m unittest discover -s tests -p test_native_ai_storage.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check source versions
        run: npm run version:check
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Test browser workflows
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npx playwright test --workers=2
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-screens-${{ github.sha }}
          path: |
            preview-results/audit/**
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload album appearance previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-appearance-previews
          path: |
            preview-results/album-appearance-*.png
            test-results/album-appearance-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload calendar previews and browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-previews
          path: |
            preview-results/calendar-*.png
            preview-results/mobile-*.png
            preview-results/menu-*.png
            preview-results/people-controls-*.png
            preview-results/people-simple-name-*.png
            preview-results/manual-photo-picker-*.png
            preview-results/pet-worker-smoke.json
            preview-results/person-worker-smoke.json
            preview-results/person-repetition-smoke.json
            preview-results/pet-runtime-benchmark.json
            preview-results/pet-review-*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload brand previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamjassak-brand-previews
          path: |
            preview-results/gomi-*.png
            preview-results/home-*.png
            test-results/branding-*.png
            test-results/home-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build TypeScript frontend
        run: npm run build
