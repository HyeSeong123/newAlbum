name: Source validation

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/warm-journal-v2, master]
  push:
    branches: [feature/warm-journal-v2, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'data/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: read

# Retain the previous group key to cancel any older packaging workflow in flight.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Native storage regression tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev python3-pil
          rustup toolchain install stable --profile minimal
      - name: Prepare local test icon
        run: /usr/bin/python3 -c "from PIL import Image; Image.open('src-tauri/icons/icon.ico').convert('RGBA').save('src-tauri/icons/icon.png')"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run Rust storage and media tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -j 2
      - name: Test legacy album storage
        run: python3 -m unittest discover -s tests -p test_album_storage.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check source versions
        run: npm run version:check
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Test browser workflows
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/photo-titles.spec.ts tests/photo-detail.spec.ts tests/journal-preview.spec.ts tests/memory-map.spec.ts tests/memory-map-v2.spec.ts --project=desktop --workers=2
          npx playwright test tests/memory-map.spec.ts tests/memory-map-v2.spec.ts --project=mobile --workers=1
          npx playwright test tests/search-diary.spec.ts --workers=2
          npx playwright test tests/album-portrait.spec.ts tests/album-animation.spec.ts tests/album-content.spec.ts tests/album-story.spec.ts tests/memories.spec.ts tests/timeline.spec.ts --workers=2
      - name: Build TypeScript frontend
        run: npm run build
