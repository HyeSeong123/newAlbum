name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/warm-journal-v2, master]
  push:
    branches: [feature/warm-journal-v2, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check application and tag versions
        id: version
        shell: pwsh
        run: |
          $version = node scripts/version.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Application version check failed.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact=oraedameun-windows-x64-$version-${{ github.run_number }}-${{ github.run_attempt }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Test photo title and album workflows
        run: |
          npx playwright install chromium
          npx playwright test tests/photo-titles.spec.ts tests/photo-detail.spec.ts tests/album-portrait.spec.ts tests/journal-preview.spec.ts --project=desktop --workers=2
      - name: Build frontend and bundle local models
        run: npm run build
      - name: Test Rust storage and local server
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --features custom-protocol
      - name: Build Windows setup executable
        run: npm run package:windows -- --ci -- --locked
      - name: Install and test the packaged app
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe installer-output/
          Copy-Item docs/windows-install.md installer-output/README.md
          Copy-Item docs/releases.md installer-output/RELEASES.md
          @{
            version = '${{ steps.version.outputs.version }}'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content installer-output/build-info.json -Encoding utf8
          Get-ChildItem installer-output/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Add-Content installer-output/SHA256SUMS.txt
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: installer-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup-diagnostics-${{ github.run_number }}
          path: test-results/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.installer.outputs.artifact }}
          path: installer-output
      - name: Save versioned installer to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release.json', 'utf8')).isDraft) { throw new Error('Published releases cannot be overwritten. Create a new version.'); }"
            gh release upload "$RELEASE_TAG" installer-output/* --clobber
          else
            gh release create "$RELEASE_TAG" installer-output/* \
              --verify-tag --draft --title "오래담은 $APP_VERSION" --generate-notes
          fi
