name: Verify signed phone APK update
on:
  push:
    branches: [qa/gomgomi-0.9.59-mobile-comparison]
    paths: [.github/workflows/phone-upgrade-check.yml, scripts/qa-phone-upgrade.py]
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/fixtures
            scripts/qa-phone-upgrade.py
      - name: Download original signed phone builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43823422688 -n Gomgomi-Android-0.9.58 -D apk-0.9.58
          for attempt in $(seq 1 40); do
            if gh run download 44339351054 -n Gomgomi-Android-0.9.59 -D apk-0.9.59; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-build: '15507667'
          emulator-options: -no-window -gpu lavapipe -cores 4 -memory 4096 -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/qa-phone-upgrade.py
