name: Refresh Android native dependency lock
on:
  push:
    branches: [chore/android-native-lock]
    paths: [.github/workflows/android-native-lock.yml]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo update --manifest-path src-tauri/Cargo.toml -p tauri --precise 2.12.1
      - uses: actions/upload-artifact@v4
        with:
          name: Android-native-Cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 7
          if-no-files-found: error
