name: App UX persona validation
on:
  workflow_dispatch:
  push:
    branches: [feature/app-ux-20261023]
    paths: ['src/**', 'tests/**', 'playwright*.ts', 'package*.json', '.github/workflows/app-ux-validation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate frontend and storage regressions
        run: |
          npm run version:check
          npm run test:unit
          python3 -m unittest discover -s tests -p 'test_*.py'
          npx tsc --noEmit
          npx vite build
      - name: Install official Playwright browser on the hosted runner
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: npx playwright install chromium
      - name: Capture unchanged 0.9.17 controls with current capture checks
        run: |
          git worktree add --detach "$RUNNER_TEMP/app-ux-before" 8e7f343ba03dc20aa6146f1c6b7e5cf4555c197b
          # Keep font files inside the baseline Vite root so its file-system policy
          # cannot block local Noto font assets through an external symlink.
          cp -a "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/app-ux-before/node_modules"
          cp playwright.app-ux.config.ts "$RUNNER_TEMP/app-ux-before/"
          cp tests/app-ux-audit.spec.ts "$RUNNER_TEMP/app-ux-before/tests/"
          cd "$RUNNER_TEMP/app-ux-before"
          APP_UX_STAGE=before "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test -c playwright.app-ux.config.ts --project mobile --grep 'capture current'
      - name: Verify updated user workflows and capture results
        env:
          APP_UX_STAGE: after
        run: npx playwright test -c playwright.app-ux.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ux-evidence-${{ github.sha }}
          path: |
            preview-results/app-ux/
            test-results/
            ${{ runner.temp }}/app-ux-before/preview-results/app-ux/
          retention-days: 14
