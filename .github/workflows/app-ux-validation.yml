name: App UX persona validation
on:
  workflow_dispatch:
  push:
    branches: [feature/app-ux-20261023]
    paths: ['src/**', 'tests/**', 'playwright*.ts', 'package*.json', '.github/workflows/app-ux-validation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Capture current tasks and expectations
        run: npx playwright test -c playwright.app-ux.config.ts --project mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ux-evidence-${{ github.sha }}
          path: |
            preview-results/app-ux/
            test-results/
          retention-days: 14
